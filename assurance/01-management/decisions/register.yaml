- id: DQ-001
  question: "What will the robot be used for, and by whom, for the first claim?"
  context: >-
    The intended use picks the product standard and how strict everything else is. A lab robot near trained
    operators can lean on distance and a gantry; a robot among the public or in homes needs force limits, fall
    protection and much more validation. **Nothing else in the plan can be sized until this is set.**
  reversibility: revisit
  blocks: "Choice of product standard (ISO 25785-1 / 10218 / 13482 / UL 3300), hazard analysis scope, every later gate"
  gate: G0
  asked: 2026-10-26
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Lab and research, trained operators only"
      detail: "Indoors, exclusion zone, gantry for untested behaviour. Follows ISO 25785-1 draft and ISO 12100. Smallest first claim; widen later."
    - key: B
      title: "Industrial work cell alongside workers"
      detail: "ISO 10218:2025 and ISO 25785-1. Needs certified-grade stops and contact limits. Much more hardware and test."
    - key: C
      title: "Service or home use among untrained people"
      detail: "ISO 13482, UL 3300. Hardest: falls near people, children, pets. Not reachable on current hardware."
  sources: ["assurance/01-management/WP-M-01-assurance-strategy.md §3", "assurance/01-management/WP-M-02-standards-map.md §2.2"]
  status: applied
  answer: {choice: B, via: inbox, at: 2026-10-26, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "a82e946", record: "WP-M-01 v0.2 §3.1, §3.2, §6; WP-M-02 v0.2 §2.2", at: 2026-10-26}

