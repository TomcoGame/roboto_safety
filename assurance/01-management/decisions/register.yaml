    shorter stopping distance, a smaller zone and a gentler fall. The envelope will enforce whatever cap you pick.
  reversibility: easy
  blocks: "Envelope speed limit; zone sizes in DQ-013"
  gate: G1
  asked: 2026-10-26
  proceed_after: 2026-11-09
  batch: 2
  options:
    - key: A
      recommended: true
      title: "0.3 m/s with a worker in the cell, full 0.6 m/s when empty"
      detail: "Halves stopping distance near people. Cost: needs a reliable \"cell empty\" signal from the zone sensor."
    - key: B
      title: "0.3 m/s always"
      detail: "Simplest. Cost: slower work."
    - key: C
      title: "No extra cap"
      detail: "Fastest. Cost: larger zones, harder falls."
  sources: ["modules/roboparty_deploy/src/inference/robots/rpo/configs/default.yaml:22", "assurance/00-assessment/gap-assessment.md F-01"]
  status: open

