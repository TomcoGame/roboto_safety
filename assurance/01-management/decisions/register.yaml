- id: DQ-012
  question: "How should the industrial claim reach the integrity it needs, given the envelope runs in the adapters?"
  context: >-
    You chose an industrial cell alongside workers and the envelope in the USB-to-CAN adapters. A cell with workers
    is expected to need PL d (two channels with monitoring) for the stops and limits. The adapters are single-channel
    STM32s with no safety rating, so on their own they are not expected to get past PL b–c. Development can go ahead on
    the adapters either way; this decides what is added before the industrial claim.
  reversibility: revisit
  blocks: "Safety concept architecture (H2); hardware budget; G3 lab validation scope"
  gate: G1
  asked: 2026-10-26
  batch: 2
  options:
    - key: A
      recommended: true
      title: "Adapters now; add a second channel before the industrial claim"
      detail: "Adapters carry the envelope through development. Before G3, add an independent channel (a small safety controller, or a certified safety relay on motor power with a monitored stop line) so the pair reaches PL d. Cost: one new board or safety relay, designed at G1."
    - key: B
      title: "Go straight to a dedicated safety controller"
      detail: "Design the PL d controller now and skip adapter-only work. Cost: hardware money and months before the robot walks under any envelope."
    - key: C
      title: "Adapters only; claim the lower PL the risk assessment allows"
      detail: "No new hardware. Cost: workers likely cannot share the cell with the robot moving; needs zone separation for every task."
  sources: ["assurance/01-management/WP-M-01-assurance-strategy.md §3.2", "DQ-001", "DQ-007"]
  status: open

- id: DQ-013
  question: "How should workers be protected when they share the cell with the robot?"
  context: >-
    ISO 10218-2:2025 allows several ways to let people near a robot: keep them in separate zones and stop the robot
    when someone enters, slow and stop as people approach (speed and separation monitoring), or limit force so contact
    is harmless (power and force limiting). A walking robot that can fall makes force limiting the hardest of the three.
    The hazard analysis puts numbers on it: with zone separation every safety function needs PL d; with workers
    mixing freely around a walking robot, the fall, limb and stop functions need PL e, which this hardware is not
    expected to reach.
  reversibility: revisit
  blocks: "Hazard analysis scope; sensors to buy; safety requirements for H4"
  gate: G1
  asked: 2026-10-26
  batch: 2
  options:
    - key: A
      recommended: true
      title: "Zone separation first: robot stops when a worker enters its zone"
      detail: "A safety-rated laser scanner or light curtain triggers the soft stop. Simplest to argue. Cost: one rated sensor; workers and robot take turns in each zone."
    - key: B
      title: "Speed and separation monitoring"
      detail: "Robot slows as people approach and stops at a computed distance. More useful. Cost: rated sensing around a moving robot; harder analysis."
    - key: C
      title: "Power and force limiting"
      detail: "Workers may touch the robot. Cost: a falling robot of this mass can exceed body-region limits; likely not reachable on this hardware."
  sources: ["assurance/01-management/WP-M-02-standards-map.md §2.2, §3.1 H4", "assurance/02-concept/WP-C-03-integrated-hazard-analysis.md §5"]
  status: open

- id: DQ-014
  question: "Is it acceptable for the robot to fall, if nobody is within reach of the fall?"
  context: >-
    Both tiers of the stop you chose can end with the robot on the floor: the red button always does, and the soft
    stop does if a motor has failed. Whether a fall into an empty zone counts as a safe outcome sets how big the clear
    zone around the robot must be, and whether a balance-keeping stop is needed before workers come close.
    The hazard analysis rates a fall onto a nearby worker as serious and unavoidable once it starts (PL d with a
    clear zone, PL e without), so the answer sets the hardest requirement in the plan.
  reversibility: hard
  blocks: "Safe-state definition (H3); size of the clear zone; whether a category 2 stop is required"
  gate: G1
  asked: 2026-10-26
  batch: 2
  options:
    - key: A
      recommended: true
      title: "Yes, if the fall zone (robot height plus margin) is kept clear"
      detail: "Fall zone held clear by the zone separation. Damage to the robot is accepted. Cost: a clear radius of at least the robot's height plus margin while it moves."
    - key: B
      title: "No: the robot must hold balance whenever a worker is in the cell"
      detail: "Needs a protective stop that keeps balance, which needs working control and a rated argument for it. Cost: the hardest safety function in the plan."
    - key: C
      title: "Yes, anywhere"
      detail: "No clear zone. Cost: a person can be struck by a falling robot. Not recommended."
  sources: ["assurance/01-management/WP-M-02-standards-map.md §1, §4", "DQ-006", "assurance/02-concept/WP-C-03-integrated-hazard-analysis.md HE-01.1, HE-01.2"]
  status: open

